<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Test Index</title>
    <style>
      body {
        font-family:
          system-ui,
          Segoe UI,
          Roboto,
          Arial;
        margin: 2rem;
      }
    </style>
  </head>
  <body>
    <button type="button" class="clear-data" onclick="showConfirmDialog()">
      Delete save
    </button>
    <p>Score:</p>
    <p id="score">Loading.</p>

    <nav>
      <a href="test1.html">Test 1</a>
      <span id="quiz1Stats" aria-live="polite"></span>
    </nav>

    <dialog id="confirmDialog">
      <p>Delete save? This cannot be undone.</p>
      <menu>
        <button type="button" id="cancelDelete">Cancel</button>
        <button type="button" id="confirmDelete">Delete</button>
      </menu>
    </dialog>
    <script>
      function clearData() {
        localStorage.removeItem("W1State");
        localStorage.removeItem("quizSharedScore");
        updateScore();
        updateQuiz1Stats();
      }

      function updateScore() {
        const el = document.getElementById("score");
        try {
          const raw = localStorage.getItem("quizSharedScore");
          const display = raw === null ? "0" : raw;
          el.textContent = display;
        } catch (e) {
          el.textContent = "Unable to load score";
        }
      }

      function getW1QuestionStats() {
        const defaults = {
          answeredWithHint: 0,
          answeredWithoutHint: 0,
          incorrect: 0,
          unanswered: 0,
        };

        try {
          const raw = localStorage.getItem("W1State");
          if (!raw) {
            return defaults;
          }

          const state = JSON.parse(raw);
          const questions = Array.isArray(state && state.questions)
            ? state.questions
            : [];

          return questions.reduce(
            (stats, question) => {
              const isAnswered = question && question.answered === true;
              const hasHint = question && question.hintRevealed === true;
              const isIncorrect =
                isAnswered &&
                (question.scored === false ||
                  question.scored === 0 ||
                  question.scored === "0");

              if (isAnswered) {
                if (hasHint) {
                  stats.answeredWithHint += 1;
                } else {
                  stats.answeredWithoutHint += 1;
                }

                if (isIncorrect) {
                  stats.incorrect += 1;
                }
              } else {
                stats.unanswered += 1;
              }

              return stats;
            },
            { ...defaults },
          );
        } catch (e) {
          return defaults;
        }
      }

      function updateQuiz1Stats() {
        const el = document.getElementById("quiz1Stats");
        if (!el) {
          return;
        }

        const stats = getW1QuestionStats();
        el.textContent = `Hinted: ${stats.answeredWithHint} · Unhinted: ${stats.answeredWithoutHint} · Incorrect: ${stats.incorrect} · Unanswered: ${stats.unanswered}`;
      }
    </script>

    <script>
      (function () {
        updateScore();
        updateQuiz1Stats();
        const dialog = document.getElementById("confirmDialog");
        document
          .getElementById("cancelDelete")
          .addEventListener("click", () => {
            dialog.close();
          });
        document
          .getElementById("confirmDelete")
          .addEventListener("click", () => {
            dialog.close();
            clearData();
          });
      })();
      function showConfirmDialog() {
        document.getElementById("confirmDialog").showModal();
      }
    </script>
  </body>
</html>
