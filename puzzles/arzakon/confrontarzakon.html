<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Return of Arzakon!</title>
    <style>
      body {
        font-family: serif;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        background: url("images/arzakonbg.jpg") center / cover no-repeat;
        background-size: 110% 110%;
        background-attachment: scroll;
        overflow: hidden;
      }
      body::after {
        content: "";
        position: fixed;
        inset: 0;
        background: #fff;
        opacity: 0;
        pointer-events: none;
        z-index: 2;
      }
      body.transitioning {
        animation: shake 0.12s linear infinite;
        background-attachment: scroll;
      }
      body.transitioning::after {
        animation: fade-white 1.8s ease-in forwards;
      }
      body.summer::after {
        animation: reveal 0.8s ease-out forwards;
      }
      @keyframes shake {
        0%,
        100% {
          transform: translate(0, 0);
          background-position: 50% 50%;
        }
        25% {
          transform: translate(-4px, 2px);
          background-position: calc(50% - 4px) calc(50% + 2px);
        }
        50% {
          transform: translate(0, 0);
          background-position: 50% 50%;
        }
        75% {
          transform: translate(4px, -2px);
          background-position: calc(50% + 4px) calc(50% - 2px);
        }
      }
      @keyframes fade-white {
        to {
          opacity: 1;
        }
      }
      @keyframes reveal {
        from {
          opacity: 1;
        }
        to {
          opacity: 0;
        }
      }
      .container {
        position: relative;
        background: rgba(255, 255, 255, 0.507);
        padding: 40px;
        border-radius: 0;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        text-align: center;
        max-width: 500px;
      }
      .share-message {
        margin: 20px auto 0;
        padding: 12px;
        background: rgba(255, 255, 255, 0.8);
        border: 1px solid rgba(0, 0, 0, 0.25);
        text-align: left;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      h1 {
        color: #000000;
        margin-bottom: 20px;
      }
      .prompt {
        font-size: 1.4rem;
        color: #000000;
        margin: 20px 0;
      }
      .button-group {
        display: flex;
        gap: 10px;
        justify-content: center;
        margin-top: 30px;
      }
      button {
        font-family: inherit;
        padding: 10px 30px;
        font-size: 16px;
        border: none;
        border-radius: 0;
        cursor: pointer;
        transition: background-color 0.3s;
      }
      .yes-btn {
        background-color: #7e0101;
        color: white;
      }
      .no-btn {
        background-color: #1e004d;
        color: white;
      }
    </style>
  </head>
  <body>
    <div class="container" id="content"></div>

    <script src="mainpages.js"></script>
    <script defer>
      function initializePage() {
        if (localStorage.getItem("game_complete") === null) {
          localStorage.setItem("game_complete", "false");
        }
        const gameComplete = localStorage.getItem("game_complete") === "true";
        console.log(`game_complete is ${gameComplete}`);
        const quizScore = localStorage.getItem("quizSharedScore") || "0";
        const contentDiv = document.getElementById("content");

        if (gameComplete) {
          // Game already complete, show score
          document.body.style.backgroundImage = 'url("images/summerbloom.jpg")';
          // document.body.style.backgroundImage = 'url("images/arzakonbg.jpg")';
          startLoopingAudio("win.wav");
          displayFinalScore(contentDiv, quizScore);
        } else if (quizScore === "0") {
          // No score yet, prompt to gather power
          document.body.style.backgroundImage = 'url("images/arzakonbg.jpg")';
          startLoopingAudio("black.wav");
          displayNoScorePrompt(contentDiv);
        } else {
          // Prompt player to end game
          document.body.style.backgroundImage = 'url("images/arzakonbg.jpg")';
          startLoopingAudio("black.wav");
          displayEndGamePrompt(contentDiv, quizScore);
        }
      }

      let pageAudio = null;

      function startLoopingAudio(filename) {
        stopPageAudio();
        pageAudio = new Audio(`audio/${filename}`);
        pageAudio.loop = true;
        pageAudio.play().catch(() => {});
      }

      function stopPageAudio() {
        if (pageAudio) {
          pageAudio.pause();
          pageAudio.currentTime = 0;
          pageAudio = null;
        }
      }

      function getShareMessage() {
        const castleScores = groupConfigs.map((group) => {
          const statsList = group.tests.map((test) =>
            getQuestionStats(test.storageKey),
          );
          return getGroupScore(statsList, group.pointsPerTier);
        });
        const totalScore = localStorage.getItem("quizSharedScore") || "0";
        return `I banished Arzakon for ${totalScore} Years!\n\n☀️: ${castleScores[0]}\n💧: ${castleScores[1]}\n💀: ${castleScores[2]}\n🔥: ${castleScores[3]}\n🌳: ${castleScores[4]}\n\nhttps://chillbrain.net/puzzles/arzakon/`;
      }

      async function copyFinalScore() {
        const message = getShareMessage();

        await navigator.clipboard.writeText(message);
        return message;
      }

      function displayEndGamePrompt(contentDiv, score) {
        contentDiv.innerHTML = `
                <h1>End the game?</h1>
                <p class="prompt"> If you end the game now, you will banish Arzakon for ${score} years.</p>
                <p class="prompt">Once you end the game, you will not be able to return and answer more questions.</p>
                <div class="button-group">
                    <button class="yes-btn" onclick="confirmEndGame('${score}')">Yes</button>
                    <button class="no-btn" onclick="declineEndGame()">No</button>
                </div>
            `;
      }

      function displayNoScorePrompt(contentDiv, score) {
        contentDiv.innerHTML = `
                <h1>Gather More Power!</h1>
                <p class="prompt">Answer more questions to confront Arzakon.</p>
                <div class="button-group">
                    <button class="no-btn" onclick="declineEndGame()">Return</button>
                </div>
            `;
      }

      function displayFinalScore(contentDiv, score) {
        const shareMessage = getShareMessage();
        contentDiv.innerHTML = `
                <h1>Game Over</h1>
                <p class="prompt">You banished Arzakon for ${score} years!</p>
          <div class="share-message">${shareMessage}</div>
                <div class="button-group">
              <button class="yes-btn" onclick="copyAndConfirm()">Share</button>
                    <button class="no-btn" onclick="declineEndGame()">Return</button>
                </div>
            `;
      }

      function confirmEndGame(score) {
        localStorage.setItem("game_complete", "true");
        stopPageAudio();
        const contentDiv = document.getElementById("content");
        contentDiv.style.visibility = "hidden";
        document.querySelectorAll("button").forEach((button) => {
          button.disabled = true;
        });
        document.body.classList.add("transitioning");
        setTimeout(() => {
          document.body.classList.remove("transitioning");
          document.body.style.backgroundImage = 'url("images/summerbloom.jpg")';
          startLoopingAudio("win.wav");
          displayFinalScore(contentDiv, score);
          contentDiv.style.visibility = "visible";
          document.body.classList.add("summer");
        }, 1800);
      }

      function declineEndGame() {
        window.location.href = "index.html";
      }

      function copyAndConfirm() {
        copyFinalScore();
        document.getElementById("content").innerHTML +=
          '<div class="copy-confirmation">Copied to clipboard!</div>';
      }

      // Initialize on page load
      window.addEventListener("load", initializePage);
    </script>
  </body>
</html>
