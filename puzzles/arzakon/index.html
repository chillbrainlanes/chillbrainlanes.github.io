<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Return of Arzakon!</title>
    <style>
      body {
        font-family: serif;
        margin: 2rem;
        background-image: url("images/bgpattern.png");
        background-repeat: repeat;
      }

      .clear-data {
        display: block;
        margin: 2rem auto;
      }

      .star-map {
        display: grid;
        grid-template:
          "green white blue"
          "green center blue"
          "red centerbottom black";
        gap: 3rem 2rem;
        align-items: center;
        max-width: 1000px;
        margin: 3rem auto;
      }

      .castle {
        min-width: 0;
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 1rem;
        border: 3px solid;
        border-radius: 0;
        box-sizing: border-box;
      }

      .castle a,
      .arzakon a {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.75rem;
        font-size: 1.2rem;
        font-weight: 700;
      }

      .castle img {
        width: min(100%, 150px);
        height: 120px;
        object-fit: contain;
      }

      .castle .stats {
        margin: 1rem 0 0;
        font-size: 0.9rem;
        line-height: 1.6;
        white-space: pre-line;
      }

      .white {
        grid-area: white;
        border-color: rgba(0, 0, 0, 0.8);
        background: rgba(253, 255, 135, 0.5);
      }
      .blue {
        grid-area: blue;
        border-color: rgba(0, 0, 0, 0.8);
        background: rgba(136, 183, 255, 0.5);
      }
      .black {
        grid-area: black;
        border-color: rgba(0, 0, 0, 0.8);
        background: rgba(174, 92, 192, 0.5);
      }
      .red {
        grid-area: red;
        border-color: rgba(0, 0, 0, 0.8);
        background: rgba(255, 123, 123, 0.5);
      }
      .green {
        grid-area: green;
        border-color: rgba(0, 0, 0, 0.8);
        background: rgba(122, 255, 122, 0.5);
      }

      .arzakon {
        grid-area: center;
        text-align: center;
        padding: 1rem;
        border: 3px solid rgba(0, 0, 0, 0.75);
        border-radius: 0;
        background: rgba(255, 185, 55, 0.5);
        box-sizing: border-box;
      }

      .arzakon .score {
        margin: 1rem 0 0;
      }

      .arzakon img {
        width: 130px;
        height: 130px;
        object-fit: contain;
      }

      @media (max-width: 700px) {
        .star-map {
          grid-template:
            "white"
            "blue"
            "black"
            "red"
            "green"
            "center";
          gap: 3rem;
        }
      }
    </style>
  </head>
  <body>
    <main class="star-map">
      <section class="castle white">
        <div>
          <a href="wcastle.html">White Castle</a>
          <a href="wcastle.html"
            ><img src="images/whitecastle.webp" alt="White Castle"
          /></a>
        </div>
        <div class="stats" id="wTotalStats" aria-live="polite"></div>
      </section>

      <section class="castle blue">
        <div>
          <a href="ucastle.html">Blue Castle</a>
          <a href="ucastle.html"
            ><img src="images/bluecastle.webp" alt="Blue Castle"
          /></a>
        </div>
        <div class="stats" id="uTotalStats" aria-live="polite"></div>
      </section>

      <section class="castle black">
        <div>
          <a href="bcastle.html">Black Castle</a>
          <a href="bcastle.html"
            ><img src="images/blackcastle.webp" alt="Black Castle"
          /></a>
        </div>
        <div class="stats" id="bTotalStats" aria-live="polite"></div>
      </section>

      <section class="castle red">
        <div>
          <a href="rcastle.html">Red Castle</a>
          <a href="rcastle.html"
            ><img src="images/redcastle.webp" alt="Red Castle"
          /></a>
        </div>
        <div class="stats" id="rTotalStats" aria-live="polite"></div>
      </section>

      <section class="castle green">
        <div>
          <a href="gcastle.html">Green Castle</a>
          <a href="gcastle.html"
            ><img src="images/greencastle.webp" alt="Green Castle"
          /></a>
        </div>
        <div class="stats" id="gTotalStats" aria-live="polite"></div>
      </section>

      <section class="arzakon">
        <a href="arzakon.html">
          <img src="images/arzakon.png" alt="Arzakon" />
          Confront Arzakon!
        </a>
        <p class="score">Total Score: <span id="score">Loading.</span></p>
      </section>

      <section class="centerbottom"></section>
    </main>

    <button type="button" class="clear-data" onclick="showConfirmDialog()">
      Delete save
    </button>

    <dialog id="confirmDialog">
      <p>Delete save? This cannot be undone.</p>
      <menu>
        <button type="button" id="cancelDelete">Cancel</button>
        <button type="button" id="confirmDelete">Delete</button>
      </menu>
    </dialog>
    <script>
      const groupConfigs = [
        {
          totalElementId: "wTotalStats",
          pointsPerTier: 10,
          tests: [
            { elementId: "w1Stats", storageKey: "W1State" },
            { elementId: "w2Stats", storageKey: "W2State" },
            { elementId: "w3Stats", storageKey: "W3State" },
          ],
        },
        {
          totalElementId: "uTotalStats",
          pointsPerTier: 10,
          tests: [
            { elementId: "u1Stats", storageKey: "U1State" },
            { elementId: "u2Stats", storageKey: "U2State" },
            { elementId: "u3Stats", storageKey: "U3State" },
          ],
        },
        {
          totalElementId: "bTotalStats",
          pointsPerTier: 10,
          tests: [
            { elementId: "b1Stats", storageKey: "B1State" },
            { elementId: "b2Stats", storageKey: "B2State" },
            { elementId: "b3Stats", storageKey: "B3State" },
          ],
        },
        {
          totalElementId: "rTotalStats",
          pointsPerTier: 10,
          tests: [
            { elementId: "r1Stats", storageKey: "R1State" },
            { elementId: "r2Stats", storageKey: "R2State" },
            { elementId: "r3Stats", storageKey: "R3State" },
          ],
        },
        {
          totalElementId: "gTotalStats",
          pointsPerTier: 10,
          tests: [
            { elementId: "g1Stats", storageKey: "G1State" },
            { elementId: "g2Stats", storageKey: "G2State" },
            { elementId: "g3Stats", storageKey: "G3State" },
          ],
        },
      ];

      function clearData() {
        [
          "W1State",
          "W2State",
          "W3State",
          "U1State",
          "U2State",
          "U3State",
          "B1State",
          "B2State",
          "B3State",
          "R1State",
          "R2State",
          "R3State",
          "G1State",
          "G2State",
          "G3State",
          "quizSharedScore",
          "game_complete",
        ].forEach((storageKey) => localStorage.removeItem(storageKey));
        updateScore();
        updateAllStats();
      }

      function updateScore() {
        const el = document.getElementById("score");
        try {
          const raw = localStorage.getItem("quizSharedScore");
          const display = raw === null ? "0" : raw;
          el.textContent = display;
        } catch (e) {
          el.textContent = "Unable to load score";
        }
      }

      function getQuestionStats(storageKey) {
        const defaults = {
          answeredWithHint: 0,
          answeredWithoutHint: 0,
          incorrect: 0,
          unanswered: 30,
        };

        try {
          const raw = localStorage.getItem(storageKey);
          if (!raw) {
            return defaults;
          }

          const state = JSON.parse(raw);
          const questions = Array.isArray(state && state.questions)
            ? state.questions
            : [];

          return questions.reduce(
            (stats, question) => {
              const isAnswered = question && question.answered === true;
              const hasHint = question && question.hintRevealed === true;
              const isIncorrect =
                isAnswered &&
                (question.scored === false ||
                  question.scored === 0 ||
                  question.scored === "0");

              if (isAnswered) {
                stats.unanswered -= 1;
                const isScored =
                  question.scored !== false &&
                  question.scored !== 0 &&
                  question.scored !== "0";

                if (isScored) {
                  if (hasHint) {
                    stats.answeredWithHint += 1;
                  } else {
                    stats.answeredWithoutHint += 1;
                  }
                }

                if (isIncorrect) {
                  stats.incorrect += 1;
                }
              }

              return stats;
            },
            { ...defaults },
          );
        } catch (e) {
          return defaults;
        }
      }

      function formatStats(stats) {
        return `Answered Without Hint: ${stats.answeredWithoutHint}\nAnswered With Hint: ${stats.answeredWithHint}\nIncorrect: ${stats.incorrect}\nUnanswered: ${stats.unanswered}`;
      }

      function getGroupScore(statsList, pointsPerTier) {
        return statsList.reduce(
          (score, stats, index) =>
            score +
            stats.answeredWithHint * pointsPerTier * (index + 1) +
            stats.answeredWithoutHint * pointsPerTier * 2 * (index + 1),
          0,
        );
      }

      function sumStats(statsList) {
        const defaults = {
          answeredWithHint: 0,
          answeredWithoutHint: 0,
          incorrect: 0,
          unanswered: 30,
        };

        return statsList.reduce(
          (total, stats) => {
            total.answeredWithHint += stats.answeredWithHint;
            total.answeredWithoutHint += stats.answeredWithoutHint;
            total.incorrect += stats.incorrect;
            total.unanswered += stats.unanswered;
            return total;
          },
          { ...defaults },
        );
      }

      function updateStatsForElement(storageKey, elementId) {
        const el = document.getElementById(elementId);
        if (!el) {
          return;
        }

        const stats = getQuestionStats(storageKey);
        el.textContent = formatStats(stats);
      }

      function updateGroupStats(group) {
        const statsList = group.tests.map((test) =>
          getQuestionStats(test.storageKey),
        );
        const totalStats = sumStats(statsList);
        const totalEl = document.getElementById(group.totalElementId);
        if (totalEl) {
          const totalScore = getGroupScore(statsList, group.pointsPerTier);
          totalEl.textContent = `${formatStats(totalStats)}\nCastle Score: ${totalScore}`;
        }

        group.tests.forEach((test) => {
          updateStatsForElement(test.storageKey, test.elementId);
        });
      }

      function updateAllStats() {
        groupConfigs.forEach(updateGroupStats);
      }
    </script>

    <script>
      (function () {
        updateScore();
        updateAllStats();
        const dialog = document.getElementById("confirmDialog");
        document
          .getElementById("cancelDelete")
          .addEventListener("click", () => {
            dialog.close();
          });
        document
          .getElementById("confirmDelete")
          .addEventListener("click", () => {
            dialog.close();
            clearData();
          });
      })();
      function showConfirmDialog() {
        document.getElementById("confirmDialog").showModal();
      }
    </script>
  </body>
</html>
