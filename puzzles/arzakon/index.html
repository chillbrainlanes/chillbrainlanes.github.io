<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Return of Arzakon!</title>
    <style>
      body {
        font-family: serif;
        margin: 2rem;
        background-image: url("images/bgpattern.png");
        background-repeat: repeat;
      }

      .clear-data {
        display: block;
        margin: 2rem auto;
      }

      .star-map {
        display: grid;
        grid-template:
          "green white blue"
          "green center blue"
          "red centerbottom black";
        gap: 3rem 2rem;
        align-items: center;
        max-width: 1000px;
        margin: 3rem auto;
      }

      .castle {
        min-width: 0;
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 1rem;
        border: 3px solid;
        border-radius: 0;
        box-sizing: border-box;
      }

      .castle a,
      .arzakon a {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.75rem;
        font-size: 1.2rem;
        font-weight: 700;
      }

      .castle img {
        width: min(100%, 150px);
        height: 120px;
        object-fit: contain;
      }

      .castle .stats {
        margin: 1rem 0 0;
        font-size: 0.9rem;
        line-height: 1.6;
        white-space: pre-line;
      }

      .white {
        grid-area: white;
        border-color: rgba(0, 0, 0, 0.8);
        background: rgba(253, 255, 135, 0.5);
      }
      .blue {
        grid-area: blue;
        border-color: rgba(0, 0, 0, 0.8);
        background: rgba(136, 183, 255, 0.5);
      }
      .black {
        grid-area: black;
        border-color: rgba(0, 0, 0, 0.8);
        background: rgba(174, 92, 192, 0.5);
      }
      .red {
        grid-area: red;
        border-color: rgba(0, 0, 0, 0.8);
        background: rgba(255, 123, 123, 0.5);
      }
      .green {
        grid-area: green;
        border-color: rgba(0, 0, 0, 0.8);
        background: rgba(122, 255, 122, 0.5);
      }

      .arzakon {
        grid-area: center;
        text-align: center;
        padding: 1rem;
        border: 3px solid rgba(0, 0, 0, 0.75);
        border-radius: 0;
        background: rgba(255, 185, 55, 0.5);
        box-sizing: border-box;
      }

      .arzakon .score {
        margin: 1rem 0 0;
      }

      .arzakon img {
        width: 130px;
        height: 130px;
        object-fit: contain;
      }

      @media (max-width: 700px) {
        .star-map {
          grid-template:
            "white"
            "blue"
            "black"
            "red"
            "green"
            "center";
          gap: 3rem;
        }
      }
    </style>
  </head>
  <body>
    <main class="star-map">
      <section class="castle white">
        <div>
          <a href="wcastle.html">White Castle</a>
          <a href="wcastle.html"
            ><img src="images/whitecastle.webp" alt="White Castle"
          /></a>
        </div>
        <div class="stats" id="wTotalStats" aria-live="polite"></div>
      </section>

      <section class="castle blue">
        <div>
          <a href="ucastle.html">Blue Castle</a>
          <a href="ucastle.html"
            ><img src="images/bluecastle.webp" alt="Blue Castle"
          /></a>
        </div>
        <div class="stats" id="uTotalStats" aria-live="polite"></div>
      </section>

      <section class="castle black">
        <div>
          <a href="bcastle.html">Black Castle</a>
          <a href="bcastle.html"
            ><img src="images/blackcastle.webp" alt="Black Castle"
          /></a>
        </div>
        <div class="stats" id="bTotalStats" aria-live="polite"></div>
      </section>

      <section class="castle red">
        <div>
          <a href="rcastle.html">Red Castle</a>
          <a href="rcastle.html"
            ><img src="images/redcastle.webp" alt="Red Castle"
          /></a>
        </div>
        <div class="stats" id="rTotalStats" aria-live="polite"></div>
      </section>

      <section class="castle green">
        <div>
          <a href="gcastle.html">Green Castle</a>
          <a href="gcastle.html"
            ><img src="images/greencastle.webp" alt="Green Castle"
          /></a>
        </div>
        <div class="stats" id="gTotalStats" aria-live="polite"></div>
      </section>

      <section class="arzakon">
        <a href="arzakon.html">
          <img src="images/arzakon.png" alt="Arzakon" />
          Confront Arzakon!
        </a>
        <p class="score">Total Score: <span id="score">Loading.</span></p>
      </section>

      <section class="centerbottom"></section>
    </main>

    <button type="button" class="clear-data" onclick="showConfirmDialog()">
      Delete save
    </button>

    <dialog id="confirmDialog">
      <p>Delete save? This cannot be undone.</p>
      <menu>
        <button type="button" id="cancelDelete">Cancel</button>
        <button type="button" id="confirmDelete">Delete</button>
      </menu>
    </dialog>
    <script src="mainpages.js"></script>
    <script defer>
      (function () {
        updateScore();
        updateAllStats();
        const dialog = document.getElementById("confirmDialog");
        document
          .getElementById("cancelDelete")
          .addEventListener("click", () => {
            dialog.close();
          });
        document
          .getElementById("confirmDelete")
          .addEventListener("click", () => {
            dialog.close();
            clearData();
          });
      })();
      function showConfirmDialog() {
        document.getElementById("confirmDialog").showModal();
      }
    </script>
  </body>
</html>
