<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Test Index</title>
    <style>
      body {
        background-image: url("images/whitebgpattern.png");
        background-repeat: repeat;
        font-family: serif;
        margin: 2rem;
      }

      * {
        border-radius: 0;
      }

      h1 {
        font-size: 3rem;
        margin: 0 0 0.5rem;
        text-align: center;
      }

      .description {
        margin: 0 auto 2rem;
        max-width: fortyrem;
        text-align: center;
      }

      .castle-image {
        display: block;
        margin: 0 auto 1rem;
        width: 30%;
        max-width: 100%;
      }

      .chambers {
        display: grid;
        gap: 1.5rem;
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .chamber {
        border: 1px solid #ccc;
        background-color: rgba(255, 255, 255, 0.7);
        padding: 1rem;
      }

      .chamber a {
        font-size: 2rem;
      }

      button {
        display: block;
        margin: 2rem auto 0;
        padding: 0.75rem 2rem;
        font-size: 1.25rem;
        font-family: serif;
      }

      @media (max-width: 1000px) {
        .castle-image {
          width: 80%;
        }

        .chambers {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <h1>White Castle</h1>
    <img
      class="castle-image"
      src="images/whitecastle.webp"
      alt="White Castle"
    />
    <p class="description">Placeholder text.</p>
    <section>
      <div class="chambers">
        <div class="chamber">
          <a href="wcastle1.html">Chamber 1:</a><br />
          <div id="w1Stats" aria-live="polite"></div>
        </div>
        <div class="chamber">
          <a href="wcastle2.html">Chamber 2:</a><br />
          <div id="w2Stats" aria-live="polite"></div>
        </div>
        <div class="chamber">
          <a href="wcastle3.html">Chamber 3:</a><br />
          <div id="w3Stats" aria-live="polite"></div>
        </div>
      </div>
    </section>
    <button type="button" onclick="location.href = 'index.html'">Back</button>
    <script>
      const groupConfigs = [
        {
          tests: [
            { elementId: "w1Stats", storageKey: "W1State" },
            { elementId: "w2Stats", storageKey: "W2State" },
            { elementId: "w3Stats", storageKey: "W3State" },
          ],
        },
      ];

      function getQuestionStats(storageKey) {
        const defaults = {
          answeredWithHint: 0,
          answeredWithoutHint: 0,
          incorrect: 0,
          unanswered: 30,
        };

        try {
          const raw = localStorage.getItem(storageKey);
          if (!raw) {
            return defaults;
          }

          const state = JSON.parse(raw);
          const questions = Array.isArray(state && state.questions)
            ? state.questions
            : [];

          return questions.reduce(
            (stats, question) => {
              const isAnswered = question && question.answered === true;
              const hasHint = question && question.hintRevealed === true;
              const isIncorrect =
                isAnswered &&
                (question.scored === false ||
                  question.scored === 0 ||
                  question.scored === "0");

              if (isAnswered) {
                const isScored =
                  question.scored !== false &&
                  question.scored !== 0 &&
                  question.scored !== "0";

                if (isScored) {
                  if (hasHint) {
                    stats.answeredWithHint += 1;
                  } else {
                    stats.answeredWithoutHint += 1;
                  }
                  stats.unanswered -= 1;
                }

                if (isIncorrect) {
                  stats.incorrect += 1;
                }
              }

              return stats;
            },
            { ...defaults },
          );
        } catch (e) {
          return defaults;
        }
      }

      function formatStats(stats) {
        return [
          `Answered Without Hint: ${stats.answeredWithoutHint}`,
          `Answered With Hint: ${stats.answeredWithHint}`,
          `Incorrect: ${stats.incorrect}`,
          `Unanswered: ${stats.unanswered}`,
        ]
          .map((stat) => `<div>${stat}</div>`)
          .join("");
      }

      function updateStatsForElement(storageKey, elementId) {
        const el = document.getElementById(elementId);
        if (!el) {
          return;
        }

        const stats = getQuestionStats(storageKey);
        el.innerHTML = formatStats(stats);
      }

      function updateGroupStats(group) {
        group.tests.forEach((test) => {
          updateStatsForElement(test.storageKey, test.elementId);
        });
      }

      function updateAllStats() {
        groupConfigs.forEach(updateGroupStats);
      }
    </script>

    <script>
      (function () {
        updateAllStats();
      })();
    </script>
  </body>
</html>
